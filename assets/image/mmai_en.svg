<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="'Helvetica Neue','Segoe UI','Inter',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4B5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="620" fill="#FFFFFF"/>

  <!-- Asymmetric Iteration: outer mapping frame -->
  <rect x="30" y="24" width="820" height="580" rx="18" fill="#F8FAFC" fill-opacity="0.5" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="440" y="58" text-anchor="middle" font-size="22" font-weight="600" fill="#374151">Asymmetric Iteration</text>
  <text x="440" y="82" text-anchor="middle" font-size="13" fill="#6B7280">Value relations are continuously reworked in real feedback — mechanisms occur simultaneously, with no fixed sequence</text>

  <!-- New Loop -->
  <rect x="355" y="96" width="170" height="52" rx="10" fill="#1F2937"/>
  <text x="440" y="129" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF">New Loop</text>

  <!-- Fan-out -->
  <path d="M440,148 V172" fill="none" stroke="#4B5563" stroke-width="2"/>
  <path d="M170,172 H710" fill="none" stroke="#4B5563" stroke-width="2"/>
  <path d="M170,172 V211" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M440,172 V211" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M710,172 V211" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Three mechanisms -->
  <rect x="75" y="218" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8"/>
  <text x="170" y="253" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">Core Loop</text>

  <rect x="345" y="218" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8"/>
  <text x="440" y="253" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">Core Stock</text>

  <rect x="615" y="218" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8"/>
  <text x="710" y="253" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">Stock Migration</text>

  <!-- Core Loop ↔ Core Stock: mutual reinforcement (§8.2) -->
  <text x="305" y="236" text-anchor="middle" font-size="11" fill="#6B7280">Mutual</text>
  <text x="305" y="251" text-anchor="middle" font-size="11" fill="#6B7280">reinforcement</text>
  <line x1="269" y1="262" x2="341" y2="262" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Converge into Amplifying -->
  <path d="M170,274 V318 H265 V343" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M440,274 V318 H345 V343" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="185" y="348" width="240" height="56" rx="10" fill="#E8EDF3" stroke="#1F2937" stroke-width="1.8"/>
  <text x="305" y="383" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">Amplifying Mechanism</text>

  <!-- Converge into new value-accumulation capability -->
  <path d="M305,404 V448 H380 V473" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M710,274 V448 H500 V473" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="478" width="300" height="56" rx="10" fill="#1F2937"/>
  <text x="440" y="513" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">New Value-Accumulation Capability</text>

  <!-- Legend -->
  <text x="440" y="576" text-anchor="middle" font-size="12.5" fill="#9CA3AF">References: §8.1 Core Loop · §8.2 Core Stock · §8.3 Stock Migration · §7.2 Amplifying · §7.1.3 Asymmetric Iteration</text>
</svg>
